name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install v2 dev dependencies
        run: npm ci
        working-directory: v2

      # npm uses the workflow's OIDC identity (trusted publishing), so no token is needed.
      # prepublishOnly runs the build and tests before anything is uploaded.
      - name: Publish
        run: npm publish --access public
